[project]
name = "ibkr-agent"
version = "0.1.0"
description = "长线、小资金、无情绪的 IBKR 美股组合 Agent：Claude 做研究，代码做决策与风控"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.3",
    "ib_async>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "tzdata",  # Windows 上的 zoneinfo 需要
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.16"]
crypto = ["ccxt>=4.4"]

[project.scripts]
ibkr-agent = "ibkr_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# E4/E7/E9/F：语法错误、未定义名字、没用到的导入等；B：常见陷阱；
# S110/S112：try-except-pass / try-except-continue，也就是静默吞掉错误的空 catch。
select = ["E4", "E7", "E9", "F", "B", "S110", "S112"]
