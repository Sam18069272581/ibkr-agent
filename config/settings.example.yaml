# 复制为 config/settings.yaml 后修改。规则只在这里改，运行时不允许被模型或人临时改动。

mode: paper            # paper | live
dry_run: true          # true = 只打印计划订单，不下单。模拟盘先演练一次，确认无误后改成 false

ibkr:
  host: 127.0.0.1
  port: 4002           # IB Gateway: paper 4002, live 4001
  client_id: 17
  account: ""          # 留空 = 使用唯一账户

universe:              # 候选股票池，先手工维护
  - AAPL
  - MSFT
  - GOOGL
  - BRK B
  - JNJ
  - PG
  - KO
  - V

sectors:               # 行业映射，用于行业集中度检查
  AAPL: tech
  MSFT: tech
  GOOGL: tech
  BRK B: financials
  JNJ: healthcare
  PG: staples
  KO: staples
  V: financials

decision:
  baseline_annual_return: 0.07   # 基线：长期持有大盘指数的预期年化收益
  min_excess_return: 0.02        # 至少要跑赢基线这么多才值得持有个股
  holding_years: 2.0             # 预期持有期，用来摊薄来回交易成本
  claude_adjustment_cap: 0.03    # Claude 定性调整的上限（±3 个百分点）
  claude_weight_low: 0.0         # 低信心时 Claude 调整的权重
  claude_weight_medium: 0.5
  claude_weight_high: 1.0
  rebalance_min_gain: 0.01       # 调仓带来的年化收益提升低于此值就不调

costs:
  per_share: 0.005               # IBKR Pro 固定费率（近似值，以官网为准）
  min_per_order: 1.0
  max_pct_of_value: 0.01
  spread_bps: 5                  # 半个点差的估计
  slippage_bps: 5

risk:
  max_positions: 6
  max_weight: 0.25               # 单只股票占净值上限
  max_sector_weight: 0.45
  min_order_value: 200           # 单笔订单最低金额（美元），太小手续费占比过高
  cash_buffer: 0.03              # 始终保留的现金比例
  max_orders_per_run: 6
  limit_offset_bps: 10           # 限价 = 中间价 ± 10bp
  max_quote_spread_bps: 50       # 买卖价差过大视为报价异常
  drawdown_halt: 0.20            # 从净值高点回撤 20% 停止开新仓
  kill_switch_file: data/KILL    # 这个文件存在就什么都不做

research:
  model: claude-opus-5-5
  effort: high
  journal_path: data/journal.sqlite

execution:
  benchmark: SPY                 # 只用来比较成绩，不买入
  trading_window_et: ["09:45", "15:45"]   # 美东时间，只在这个时段下单
  fill_timeout_seconds: 300      # 等成交的最长时间，超时未成交的撤单
  market_data_type: 4            # 1 实时，3 延迟 15 分钟，4 延迟冻结（休市时也返回最后价格）

graduation:                      # 模拟盘转实盘门槛：ibkr-agent graduate 检查
  min_consecutive_ok_runs: 12    # 连续成功运行（每周一次约 3 个月）
  max_cost_ratio: 1.5            # 实际手续费+滑点 / 模型估计
  max_underperformance: 0.05     # 收益落后基准不超过 5 个百分点
  allow_drawdown_halt: false     # 期间触发过回撤熔断就不通过

crypto:                          # 币圈部分：ibkr-agent crypto run
  enabled: false                 # 改成 true 才会运行
  exchange: okx
  hostname: ""                   # 留空即可；欧洲站账户连不上时，填 OKX 文档给的 API 域名
  sandbox: true                  # true = OKX 模拟盘（Demo Trading，需要模拟盘的 API key）
  dry_run: true                  # true = 只打印计划，不下单
  paper_local: false             # true = 不连账户，用本地模拟账户 + 公开行情（不需要 key）
  paper_start_cash: 300          # 本地模拟账户的起始现金
  quote: EUR
  targets:                       # 目标比例，剩下的是现金
    BTC: 0.6
    ETH: 0.4
  rebalance_band: 0.10           # 偏离目标超过 10 个百分点才调
  costs:
    maker_fee: 0.0008            # OKX 普通用户现货（约值，以官网为准）
    taker_fee: 0.0010
    spread_bps: 2
    slippage_bps: 3
  risk:
    max_weight: 0.70             # 单币上限
    drawdown_halt: 0.35          # 从高点回撤 35% 停止买入
    cash_buffer: 0.02
    min_order_value: 10          # 单笔最少 10 欧
    max_orders_per_run: 4
    max_spread_bps: 30
    kill_switch_file: data/KILL  # 和美股共用同一个总开关
  execution:
    price_band: 0.005            # 下单前重取价，超出计划价 ±0.5% 就不追
    plan_ttl_minutes: 15         # 计划 15 分钟后作废
    max_quote_age_seconds: 2     # 报价超过 2 秒就算过期
    fill_timeout_seconds: 300
    shock_move: 0.03             # 15 分钟内波动超过 3% 不买
    shock_window_minutes: 15
  tax:                           # 德国 §23 EStG 简化模型，只用来决定“现在卖还是等满一年”
    tax_free_after_days: 365
    annual_threshold: 1000       # 年度短期收益 Freigrenze
    est_tax_rate: 0.30
  ai:                            # 慢思考 + 快哨兵。模型只给边界和概率，阈值和金额由代码定
    envelope_enabled: false      # true = 运行时读取 Opus 的每周边界（先跑 crypto envelope）
    envelope_model: claude-opus-5-5
    envelope_effort: high
    envelope_valid_days: 8       # 每周跑一次 crypto envelope，过期的边界不再使用
    max_tilt: 0.10               # Opus 最多把目标比例上下调 10 个百分点
    max_band: 0.25               # 买入价区间最多离现价 ±25%
    gate_enabled: false          # true = 每笔买入前问快哨兵；没回答就不买，卖出不受影响
    gate_model: claude-haiku-5-5
    gate_effort: low
    gate_max_p_invalidated: 0.30
    gate_max_p_abnormal: 0.30
    monthly_budget_usd: 8        # 本月 API 花费上限（美元），到了就不再调用
